<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girdie Golf — Live</title>
<meta name="robots" content="noindex">

<!--
  girdie-golf.com/live  ->  wherever the Jeffersonville hole #4 stream currently lives.

  WHY THIS PAGE EXISTS. The QR code on the camera-pole sign is printed on Dibond and
  bolted to a pole for 5-7 years. It must therefore point at a URL Girdie controls, not
  at a YouTube one. On 2026-09-17 that stopped being theoretical: the stream was genuinely
  live (watch?v=6i1XYDDZVwY, HLS manifest present, status OK) while
  youtube.com/@GirdieGolfCo/live refused to redirect to it for over 30 minutes of
  continuous polling. Had the sign encoded that YouTube alias, every golfer who scanned it
  would have hit a dead end and the only fix would have been reprinting the sign.

  TO REPOINT THE STREAM: change STREAM_URL below. That is the whole job - it is used by
  the meta refresh, the script, and the visible link, so there is exactly one line to edit
  and no way for them to drift apart.
-->

<script>
  // ---- THE ONLY LINE THAT NORMALLY NEEDS EDITING -------------------------------------
  // The CHANNEL page, deliberately - not a watch?v= id, and not the /live alias.
  //
  // This choice is the whole point of the page, so it is worth being explicit about the
  // two rejected options:
  //
  //   /live      - id-independent and would be ideal, but it is BROKEN for this channel.
  //                Measured 2026-09-17: the stream was live for 70+ minutes (channel page
  //                reported isLiveNow:true throughout) and /live never once redirected.
  //                That is far past propagation lag.
  //   watch?v=   - works, and is one tap faster, but the id dies with its broadcast.
  //                YouTube's auto-stop ends a broadcast on any encoder blip, and the
  //                replacement gets a new id - so a fixed id is a dead QR code waiting
  //                for a bad night. The camera feed already drops several times a day.
  //
  // The channel page always resolves and surfaces the live stream at the top with a LIVE
  // badge. It costs the golfer one tap. In exchange, this URL cannot go stale - which is
  // the property that actually matters when the QR pointing at it is printed on Dibond
  // and bolted to a pole for 5-7 years.
  var STREAM_URL = "https://www.youtube.com/@GirdieGolfCo";
  // ------------------------------------------------------------------------------------

  // replace() rather than assign(): a golfer who taps Back should return to whatever they
  // were doing, not bounce off this page straight back into YouTube.
  window.addEventListener("DOMContentLoaded", function () {
    var a = document.getElementById("go");
    a.href = STREAM_URL;
    var m = document.createElement("meta");        // no-JS fallback is the <noscript> below;
    m.httpEquiv = "refresh";                       // this one just makes the JS path robust
    m.content = "3;url=" + STREAM_URL;             // if location.replace is blocked.
    document.head.appendChild(m);
    setTimeout(function () { window.location.replace(STREAM_URL); }, 250);
  });
</script>

<style>
  :root{
    --navy:#0B0A1F; --cream:#F6F4EC; --lime:#C6DB4C; --lime-dim:#A8BC38;
    --text:#E9E8F2; --muted:#9C99B8;
    --head:'Barlow Condensed',Impact,sans-serif;
    --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--navy); color:var(--text); font-family:var(--body);
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; line-height:1.5;
  }
  .card{max-width:22rem;width:100%}
  .badge{
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:var(--head); font-weight:700; letter-spacing:.08em;
    font-size:.95rem; text-transform:uppercase;
    color:var(--navy); background:var(--lime);
    padding:.35rem .8rem; border-radius:999px; margin-bottom:1.1rem;
  }
  .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--navy);
       animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-family:var(--head); font-weight:700; font-size:2.6rem; line-height:1.05;
     margin:0 0 .6rem; letter-spacing:.01em}
  p{margin:0 0 1.6rem; color:var(--muted); font-size:1rem}
  /* Big, high-contrast tap target: this is read on a phone, outdoors, in direct sun. */
  a.btn{
    display:block; background:var(--lime); color:var(--navy);
    font-family:var(--head); font-weight:700; font-size:1.3rem; letter-spacing:.04em;
    text-transform:uppercase; text-decoration:none;
    padding:.85rem 1rem; border-radius:.6rem; min-height:48px;
  }
  a.btn:active{background:var(--lime-dim)}
  .alt{display:block; margin-top:1.1rem; color:var(--muted); font-size:.85rem}
  .alt a{color:var(--cream)}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>Now streaming</span>
    <h1>Taking you to the live stream</h1>
    <p>Hole #4 at Jeffersonville, live on YouTube. Look for the <strong>LIVE</strong> badge at the top of the channel.</p>
    <!-- href is set by the script; this literal is the no-JS fallback and must be kept
         identical to STREAM_URL above. -->
    <a class="btn" id="go" href="https://www.youtube.com/@GirdieGolfCo">Watch now</a>
    <span class="alt">Not loading? <a href="https://girdie-golf.com">girdie-golf.com</a></span>
  </main>
  <noscript>
    <!-- Without JS the script's meta refresh never runs, so ship one in the markup too.
         3s, not 0s: an instant refresh with no visible content is disorienting and some
         screen readers announce nothing at all before the jump. -->
    <meta http-equiv="refresh" content="3;url=https://www.youtube.com/@GirdieGolfCo">
  </noscript>
</body>
</html>
